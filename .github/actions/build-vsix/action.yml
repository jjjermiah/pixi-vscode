name: "Build VSIX"
description: "Build the extension's VSIX"

runs:
    using: "composite"
    steps:
        - name: Install Pixi
          uses: prefix-dev/setup-pixi@v0.8.1
          with:
              pixi-version: v0.33.0
              cache: true

        - name: Build VSIX
          run: pixi run package --pre-release
          shell: bash

        - name: Upload VSIX Pre-Release
          uses: actions/upload-artifact@v4
          with:
              name: vsix
              path: ms-python-envs-insiders.vsix
              if-no-files-found: error
              retention-days: 7
