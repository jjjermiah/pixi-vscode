name: "Build VSIX"
description: "Build the extension's VSIX"

runs:
    using: "composite"
    steps:
        - name: Install Pixi
          uses: prefix-dev/setup-pixi@v0.8.8
          with:
              pixi-version: v0.46.0
              cache: true

        - name: Build VSIX
          run: pixi run package --pre-release
          shell: bash

        - name: Find VSIX path
          id: find_vsix
          run: |
              echo "VSIX_PATH=$(find . -name '*.vsix' | head -n 1)" >> $GITHUB_ENV
          shell: bash

        - name: Upload VSIX Pre-Release
          uses: actions/upload-artifact@v4
          with:
              name: vsix
              path: ${{ env.VSIX_PATH }}
              if-no-files-found: error
              retention-days: 7
